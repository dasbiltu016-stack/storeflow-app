name: Build Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          unzip -o "*.zip" || [ $? -eq 1 ]
          if [ ! -f "gradlew" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "gradlew" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cp -r "$SUBDIR"/* .
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Keystore (If not provided)
        run: |
          if [ ! -f "app/release.keystore" ]; then
            keytool -genkey -v -keystore app/release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=App, OU=Dev, O=Org, L=City, S=State, C=IN"
          fi

      - name: Build Signed AAB
        run: |
          ./gradlew bundleRelease

      - name: Sign AAB File
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/release.keystore -storepass 123456 -keypass 123456 "$AAB_PATH" my-key-alias

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: app/build/outputs/bundle/release/*.aab
