name: Build Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project || [ $? -eq 1 ]

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Convert Web/React to Android
        run: |
          # জিপের ভেতরে যেখানে package.json বা index.html আছে সেই আসল ফোল্ডারটি খুঁজে বের করা
          TARGET_FILE=$(find extracted_project -name "package.json" -o -name "gradlew" -o -name "index.html" | head -n 1)
          if [ -z "$TARGET_FILE" ]; then
            echo "Error: জিপ ফাইলের ভেতরে কোনো প্রজেক্ট ফাইল (index.html বা package.json) পাওয়া যায়নি!"
            ls -laR extracted_project
            exit 1
          fi
          PROJECT_DIR=$(dirname "$TARGET_FILE")
          echo "Project found in: $PROJECT_DIR"
          cp -r "$PROJECT_DIR"/* .

          if [ ! -f "gradlew" ]; then
            if [ -f "package.json" ]; then
              npm install
              npm run build || true
              WEB_DIR="dist"
              [ -d "build" ] && WEB_DIR="build"
            else
              npm init -y
              mkdir -p www
              cp -r *.html *.css *.js assets images 2>/dev/null www/ || true
              WEB_DIR="www"
            fi
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "StoreFlow" "com.dasbiltu.storeflow" --web-dir="$WEB_DIR"
            npx cap add android
            cp -r android/* .
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Keystore
        run: |
          if [ ! -f "app/release.keystore" ]; then
            keytool -genkey -v -keystore app/release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=StoreFlow, OU=Dev, O=Org, L=City, S=State, C=IN"
          fi

      - name: Build Signed AAB
        run: ./gradlew bundleRelease

      - name: Sign AAB File
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/release.keystore -storepass 123456 -keypass 123456 "$AAB_PATH" my-key-alias

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: app/build/outputs/bundle/release/*.aab
